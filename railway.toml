[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# The /data volume (SQLite file + uploads) is attached from the Railway
# dashboard/CLI, not this file — Railway volumes aren't a railway.toml field.
